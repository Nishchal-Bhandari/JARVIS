[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-backend"
version = "0.1.0"
description = "J.A.R.V.I.S. incident-intelligence prototype"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "networkx>=3.2",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# B008: FastAPI Depends()/File() in defaults is the framework's idiom.
# BLE001/S110: broadcast hub intentionally swallows a dead subscriber.
ignore = ["B008", "BLE001", "S110"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
